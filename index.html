<!DOCTYPE html>
<html>
<head>
<title>Simple Calculator</title>
</head>
<body>

<h2>Simple Calculator</h2>

<input type="number" id="num1" placeholder=" Enter your First number">
<br><br>

<select id="operator1">
  <option value="+">+</option>
  <option value="-">-</option>
  <option value="*">*</option>
  <option value="/">/</option>
</select>
<br><br>

<input type="number" id="num2" placeholder="Second number">
<br><br>
<select id="operator2">
  <option value="+">+</option>
  <option value="-">-</option>
  <option value="*">*</option>
  <option value="/">/</option>
</select>
<br><br>
<input type="number" id="num3" placeholder="Third number">

<br><br>
<button id="calcBtn">Calculate</button>

<h3 id="result"></h3>

<script>
document.getElementById("calcBtn").addEventListener("click", function() 
{
  let num1 = parseFloat(document.getElementById("num1").value);
  let num2 = parseFloat(document.getElementById("num2").value);
  let num3 = parseFloat(document.getElementById("num3").value);
  let opera1 = document.getElementById("operator1").value;
   let opera2 = document.getElementById("operator2").value;
  let result;

  // if (operator === "+") {
  //   result = num1 + num2 + num3;
  // } else if (operator === "-") {
  //   result = num1 - num2-num3;
  // } else if (operator === "*") {
  //   result = num1 * num2*num3;
  // } else if (operator === "/") {
  //   result = num1 / num2/num4;
  // }

// Combine them into a single string equation, e.g., "5 + 3 * 2"
let equation = ${num1} ${opera1} ${num2} ${opera2} ${num3};

// Safely execute the mathematical string expression
result = new Function(return ${equation})();

  document.getElementById("result").innerText= "Result: " + result;


});

</script>

</body>
</html>
